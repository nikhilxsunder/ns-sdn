[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ns-sdn"
dynamic = ["version"]
description = "Non-Stationary Spectral Decomposition Network: a neural state-space model emitting an interpretable time-varying spectral decomposition of economic and financial time series."
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "Nikhil Sunder", email = "nsunder724@gmail.com" },
    { name = "Maikel Leon", email = "mleon@miami.edu" },
]
requires-python = ">=3.12,<4.0"
keywords = [
    "time series",
    "spectral decomposition",
    "state space",
    "instantaneous frequency",
    "econometrics",
    "neural network",
    "pytorch",
]
classifiers = [
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Financial and Insurance Industry",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Office/Business :: Financial :: Investment",
    "Typing :: Typed",
]
dependencies = [
    "numpy>=1.26",
    "torch>=2.2",
]

# Optional extras a user installs by name: `pip install "ns-sdn[pandas,data]"`.
[project.optional-dependencies]
pandas = ["pandas"]
data = ["fedfred"]
plot = ["matplotlib"]
all = ["pandas", "fedfred", "matplotlib"]

[project.urls]
Repository    = "https://github.com/nikhilxsunder/ns-sdn"
Documentation = "https://nikhilxsunder.github.io/ns-sdn/"

# ── Composable dependency groups ─────────────────────────────────────────────
# Each group is independently installable; `dev` composes all of them.
# CI jobs use the minimal group they need (e.g. --group test for test runs).

[dependency-groups]
types = [
    "pandas-stubs",
]
test = [
    "pytest",
    "pytest-cov",
    "hypothesis",
    "pandas",
    { include-group = "types" },
]
lint = [
    "ruff",
    "mypy",
    "bandit",
    "pip-audit",
    { include-group = "types" },
]
docs = [
    "sphinx",
    "pydata-sphinx-theme",
    "sphinx-design",
    "sphinx-autodoc-typehints",
    "myst-parser",
    "linkify-it-py",
    "sphinx-sitemap",
    "sphinxext-opengraph",
    "sphinx-codeautolink",
    "sphinx-copybutton",
    "sphinx-remove-toctrees",
    "sphinx-last-updated-by-git",
    "sphinxcontrib-bibtex",
    "sphinx-gallery",
    "sphinx-tippy",
    "packaging",
    "matplotlib",
    "pandas",
    "fedfred",
]
notebooks = [
    "ipykernel",
    "notebook",
    "fedfred",
    "matplotlib",
    "pandas",
]
tools = [
    "pre-commit",
]
dev = [
    { include-group = "test" },
    { include-group = "lint" },
    { include-group = "docs" },
    { include-group = "notebooks" },
    { include-group = "tools" },
]

# ── uv config ────────────────────────────────────────────────────────────────

[tool.uv]
managed = true

# CI runners are Linux: pin torch there to the CPU wheels so a sync is a few
# hundred MB instead of the multi-GB CUDA stack PyPI's Linux wheel pulls in.
# macOS keeps PyPI's wheel, which is already CPU/MPS.
[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

# ── build ────────────────────────────────────────────────────────────────────

[tool.hatch.version]
path = "src/ns_sdn/__about__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/ns_sdn"]

[tool.hatch.build.targets.sdist]
exclude = [
    ".ns-sdn",
    ".github",
    ".vscode",
    "assets",
    "conda-forge",
    "conda-recipe",
    "dist",
    "docs",
    "figures",
    "notebooks",
    "papers",
    "references",
    "*.md",
    "!README.md",
    "!CHANGELOG.md",
]

# ── tool configs ─────────────────────────────────────────────────────────────

[tool.mypy]
files = "src/ns_sdn"
python_version = "3.12"
ignore_missing_imports = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "ANN", "D"]
ignore = ["D203", "D213", "D105", "D107"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D103"]
"examples/*" = ["D", "E402"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.isort]
known-first-party = ["ns_sdn"]
known-local-folder = ["_fred"]

[tool.bandit]
exclude_dirs = ["tests", "docs", "notebooks"]

[tool.pytest.ini_options]
addopts = "--doctest-modules --cov=src/ns_sdn --cov-report=term-missing --cov-report=html"
testpaths = ["src/ns_sdn", "tests"]
pythonpath = ["src"]

[tool.coverage.run]
source = ["src/ns_sdn"]
omit = [
    "tests/*",
    "*/tests/*",
    "*_test.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    '@(typing\.)?overload',
]
